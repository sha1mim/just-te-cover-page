<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JUST Cover Page Generator</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2330;--mut:#6b7686;--bd:#d9dfe8;--ac:#0b6b3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#93a0b0;--bd:#2d3744;--ac:#3fb678}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#93a0b0;--bd:#2d3744;--ac:#3fb678}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.wrap{grid-template-columns:380px minmax(0,1fr)}}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ac);margin:14px 0 6px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;gap:8px;margin-top:14px}
button{flex:1;padding:11px;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.pri{background:var(--ac);color:#fff}.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.pv{overflow-x:auto}
#paper{width:210mm;height:297mm;background:#fff;color:#222;padding:28mm 20mm;margin:0 auto;font-family:"Times New Roman",Times,"Noto Serif",serif;text-align:center}
.un{font-size:28px;margin:0 0 22px;color:#333}
.logo img{width:112px;height:auto;mix-blend-mode:multiply}
.dp{font-size:26px;font-weight:700;margin:26px 0 20px;color:#333}
.cs{font-size:19px;margin:8px 0}.cs span{background:#e3e3e3;padding:0 4px}
.tb{border:1px solid #555;margin:18px 0 40px;min-height:120px;padding:8px 10px;font-size:19px;font-weight:700;line-height:1.5}
.tb .t{font-weight:400;margin-top:6px}
table{width:100%;border-collapse:collapse;text-align:left;font-size:17px;table-layout:fixed}
th{background:#c9c9c9;border:1px solid #555;padding:6px;text-align:center;font-size:20px}
td{border:1px solid #555;padding:6px 8px;vertical-align:top;height:150px;line-height:1.35}
.dt{text-align:left;font-weight:700;font-size:18px;margin:40px 0 0 22%}
.am{text-align:center;padding-left:40px}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}.wrap{display:block;padding:0;max-width:none}
 .ctl{display:none}.pv{overflow:visible}
 #paper{margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="ctl card">
  <h1>JUST Cover Page Generator</h1>
  <p class="sub">ফর্ম পূরণ করুন, প্রিভিউ সাথে সাথে আপডেট হবে</p>
  <h2>Document</h2>
  <label>Department</label><input id="dep" value="Textile Engineering">
  <div class="row"><div><label>Course Title</label><input id="ct" value=""></div><div><label>Course Code</label><input id="cc" value=""></div></div>
  <label>Type</label>
  <select id="ty"><option>Lab Report</option><option>Assignment</option><option>Report</option><option>Presentation</option><option>Term Paper</option></select>
  <label>Topic (On ...)</label><input id="tp" placeholder="রিপোর্টের বিষয়">
  <h2>Submitted by</h2>
  <label>Name</label><input id="sn" value="Shamim">
  <div class="row"><div><label>Roll</label><input id="si" value="2422"></div><div><label>Year / Semester</label><input id="ss" value=" Year,  Semester"></div></div>
  <h2>Submitted to</h2>
  <label>Teacher 1</label><input id="t1" value="">
  <label>Designation 1</label><input id="d1" value="Professor">
  <label>Teacher 2 (ঐচ্ছিক)</label><input id="t2" value="">
  <label>Designation 2</label><input id="d2" value="Lecturer">
  <label>Teachers' department</label><input id="td" value="Textile Engineering">
  <label>Date of Submission</label><input type="date" id="sd">
  <div class="btns"><button class="pri" id="dl">⬇ Download PDF</button><button class="sec" id="rs">Reset</button></div>
  <p class="sub" style="margin-top:8px">PDF বাটনে চাপলে Print ডায়ালগ খুলবে → “Save as PDF” নির্বাচন করুন।</p>
 </div>

 var dep=v("dep"),uni="Jashore University of Science and Technology.";
 var h='<p class="un">Jashore University of Science and Technology</p>';
 h+='<div class="logo"><img src="'+LOGO+'" alt="JUST logo"></div>';
 h+='<p class="dp">Department of '+dep+'</p>';
 if(v("ct"))h+='<p class="cs"><span>Course Title: '+v("ct")+'</span></p>';
 if(v("cc"))h+='<p class="cs"><span>Course Code: '+v("cc")+'</span></p>';
 h+='<div class="tb">'+art[$("ty").value]+' '+v("ty")+'<br>On'+(v("tp")?'<div class="t">'+v("tp")+'</div>':'')+'</div>';
 h+='<table><tr><th>Submitted By</th><th>Submitted To</th></tr><tr><td>';
 h+='<b>Name: '+v("sn")+'<br>Roll: '+v("si")+'</b><br>'+v("ss")+'<br>Department of '+dep+'<br>'+uni+'</td><td>';
 if(v("t1"))h+='<b>'+v("t1")+'</b><br>'+v("d1")+'<br>';
 if(v("t2"))h+='<div class="am">&amp;</div><b>'+v("t2")+'</b><br>'+v("d2")+'<br>';
 h+='Department of '+(v("td")||dep)+'<br>'+uni+'</td></tr></table>';
 h+='<p class="dt">Date of Submission: '+fmt($("sd").value)+'</p>';
 $("paper").innerHTML=h;
}
ids.forEach(function(i){$(i).addEventListener("input",render)});
$("dl").addEventListener("click",function(){window.print()});
var defs={};ids.forEach(function(i){defs[i]=$(i).value});
$("rs").addEventListener("click",function(){ids.forEach(function(i){$(i).value=defs[i]});render()});
render();
</script>
